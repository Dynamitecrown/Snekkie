name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target, Linux catches platform assumptions
        # and runs the pty-based serial tests that Windows has to skip.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PySide6 needs X libraries present even for offscreen rendering.
      - name: Install Qt system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check snekkie tests

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

  build-exe:
    # Only builds the Windows executable for tagged releases.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: pip install -e ".[build]"

      - name: Build
        run: pyinstaller --noconsole --onefile --name snekkie launcher.py

      - uses: actions/upload-artifact@v4
        with:
          name: snekkie-windows
          path: dist/snekkie.exe
