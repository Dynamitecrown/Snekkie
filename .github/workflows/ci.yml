name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign this manual build with SignPath (requires enrollment and SIGNPATH_ENABLED).
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target. Linux and macOS also run the
        # pty-based serial tests that Windows has to skip.
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  build-windows:
    # Builds for tagged releases, or on demand from the Actions tab so the
    # packaging can be checked without publishing anything.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      signing: ${{ steps.signing.outputs.enabled }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          # A tag that doesn't match Cargo.toml would publish an installer
          # that reports the wrong version and breaks upgrade detection.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME.Substring(1)
            if ($tag -ne $version) {
              Write-Error "Tag v$tag does not match the version in Cargo.toml ($version). Bump Cargo.toml, commit, and tag again."
              exit 1
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Select signing mode
        id: signing
        shell: pwsh
        env:
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
          REQUEST_SIGNING: ${{ inputs.sign }}
        run: |
          $isTag = $env:GITHUB_REF -like 'refs/tags/v*'
          $requested = $env:REQUEST_SIGNING -eq 'true'
          if ($requested -and $env:SIGNPATH_ENABLED -ne 'true') {
            throw 'Enroll with SignPath and set SIGNPATH_ENABLED=true first. See docs/code-signing.md.'
          }
          $enabled = $env:SIGNPATH_ENABLED -eq 'true' -and ($isTag -or $requested)
          if ($enabled -and -not ($isTag -or $env:GITHUB_REF -eq 'refs/heads/main')) {
            throw 'Signed manual builds must run from main; signed releases must use a v* tag.'
          }
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $enabled) {
            Write-Host 'Building unsigned Windows artifacts. See docs/code-signing.md to enable free SignPath signing.'
          }

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: snekkie-windows-exe
          path: target/release/snekkie.exe

  prepare-windows:
    # Linux's NSIS package can build a 64-bit installer (the official Windows
    # one can't), and it's the build the installer was tested with.
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: snekkie-windows-exe
          path: exe

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Export the uninstaller and stage the app
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          mkdir -p dist payload
          makensis -V2 -DVERSION="$VERSION" -DEXE=../exe/snekkie.exe \
            -DEXPORT_UNINSTALLER=../payload/uninstall.exe \
            -DOUTFILE=../dist/export-only.exe installer/snekkie.nsi
          cp exe/snekkie.exe payload/snekkie.exe
          test -s payload/uninstall.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-payload-unsigned
          path: payload/*.exe
          if-no-files-found: error

  sign-payload:
    needs: [build-windows, prepare-windows]
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-payload-unsigned
          path: payload-unsigned

      # Re-upload in this job so SignPath can verify the request's provenance.
      - uses: actions/upload-artifact@v7
        if: needs.build-windows.outputs.signing == 'true'
        id: unsigned-payload
        with:
          name: signpath-payload-input
          path: payload-unsigned/*.exe
          if-no-files-found: error

      - name: Sign app and uninstaller
        if: needs.build-windows.outputs.signing == 'true'
        uses: ./.github/actions/signpath
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-payload-v1
          artifact-id: ${{ steps.unsigned-payload.outputs.artifact-id }}
          version: ${{ needs.build-windows.outputs.version }}
          output-directory: payload

      - name: Stage unsigned payload for a build without signing
        if: needs.build-windows.outputs.signing != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path payload | Out-Null
          Copy-Item payload-unsigned/*.exe payload/

      - name: Verify payload signatures and timestamps
        if: needs.build-windows.outputs.signing == 'true'
        shell: pwsh
        run: ./scripts/verify-signatures.ps1 -Path @('payload/snekkie.exe', 'payload/uninstall.exe')

      - uses: actions/upload-artifact@v7
        with:
          name: windows-payload
          path: payload/*.exe
          if-no-files-found: error

  installer:
    # Keep the existing Linux NSIS build and its 64-bit installer stubs.
    needs: [build-windows, sign-payload]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-payload
          path: payload

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Package the verified payload
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          mkdir -p dist
          makensis -V2 -DVERSION="$VERSION" -DEXE=../payload/snekkie.exe \
            -DSIGNED_UNINSTALLER=../payload/uninstall.exe installer/snekkie.nsi
          cp payload/snekkie.exe "dist/snekkie-$VERSION-portable.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-packaged
          path: dist/*.exe
          if-no-files-found: error

  sign-windows:
    needs: [build-windows, sign-payload, installer]
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-packaged
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: windows-payload
          path: payload

      - uses: actions/upload-artifact@v7
        if: needs.build-windows.outputs.signing == 'true'
        id: unsigned-installer
        with:
          name: signpath-installer-input
          path: dist/Snekkie-Setup-*.exe
          if-no-files-found: error

      - name: Sign the finished installer
        if: needs.build-windows.outputs.signing == 'true'
        uses: ./.github/actions/signpath
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-installer-v1
          artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          version: ${{ needs.build-windows.outputs.version }}
          output-directory: installer-signed

      - name: Use the signed installer
        if: needs.build-windows.outputs.signing == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: Copy-Item -LiteralPath "installer-signed/Snekkie-Setup-$env:VERSION.exe" -Destination dist/ -Force

      - name: Verify the final Windows package
        shell: pwsh
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}
          REQUIRE_SIGNATURES: ${{ needs.build-windows.outputs.signing }}
        run: |
          ./scripts/verify-windows-package.ps1 -Version $env:VERSION -DistDirectory dist -PayloadDirectory payload `
            -RequireSignatures:($env:REQUIRE_SIGNATURES -eq 'true')

      - uses: actions/upload-artifact@v7
        with:
          name: snekkie-windows
          path: dist/*.exe
          if-no-files-found: error

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    # The binary only runs on systems whose glibc is at least as new as the
    # one it was built against, so build on the oldest supported runner.
    runs-on: ubuntu-22.04

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Read the version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [[ $GITHUB_REF == refs/tags/v* && ${GITHUB_REF_NAME#v} != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release --locked

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev rpm desktop-file-utils \
            libxkbcommon0 libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6

      # The tarball keeps the executable bit, which plain downloads drop.
      # Revision 0 packages and an older 0.0.1 release are test fixtures for
      # upgrades; only dist/ is published.
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist fixtures/revision-0 fixtures/older
          tar -czf dist/snekkie-linux-x86_64.tar.gz -C target/release snekkie
          bash scripts/package-linux.sh "$VERSION" target/release/snekkie dist 1
          bash scripts/package-appimage.sh "$VERSION" target/release/snekkie dist
          bash scripts/package-linux.sh "$VERSION" target/release/snekkie fixtures/revision-0 0
          bash scripts/package-linux.sh 0.0.1 target/release/snekkie fixtures/older 1
          bash scripts/package-appimage.sh 0.0.1 target/release/snekkie fixtures/older
          cp target/release/snekkie fixtures/snekkie
          ls -l dist fixtures/*

      - uses: actions/upload-artifact@v7
        with:
          name: snekkie-linux
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: linux-test-fixtures
          path: fixtures/
          if-no-files-found: error

  linux-packages:
    # Real package-manager installs, upgrades and removals, a desktop launch,
    # and the online installer, each in a disposable container.
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:22.04, ubuntu:24.04, debian:12, debian:13, fedora:44, opensuse/leap:16.0, opensuse/tumbleweed]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: snekkie-linux
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: linux-test-fixtures
          path: fixtures

      - name: Package lifecycle and desktop launch
        env:
          VERSION: ${{ needs.build-linux.outputs.version }}
        run: bash scripts/test-linux-packages.sh dist "$VERSION" fixtures/revision-0 "${{ matrix.image }}"

      - name: Online installer from local release folders
        run: |
          mkdir -p installer-new
          cp dist/*.deb dist/*.rpm dist/*.AppImage installer-new/
          (cd installer-new && sha256sum -- * > SHA256SUMS)
          (cd fixtures/older && sha256sum -- * > SHA256SUMS)
          bash scripts/test-install-script.sh containers fixtures/older installer-new "${{ matrix.image }}"

  flatpak:
    # Packages the Ubuntu 22.04 binary for the Freedesktop runtime, then
    # installs, launches and updates it, and launches the AppImage.
    needs: build-linux
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-test-fixtures
          path: fixtures

      - uses: actions/download-artifact@v8
        with:
          name: snekkie-linux
          path: dist

      - name: Install Flatpak and desktop test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak appstream appstream-compose \
            desktop-file-utils binutils python3 xvfb xauth xdotool dbus-x11 imagemagick \
            libgl1-mesa-dri libegl1 libgl1 libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6

      - name: Build the Flatpak bundles
        env:
          VERSION: ${{ needs.build-linux.outputs.version }}
        run: |
          chmod 0755 fixtures/snekkie dist/*.AppImage fixtures/older/*.AppImage
          mkdir -p flatpak
          bash scripts/package-flatpak.sh "$VERSION" fixtures/snekkie flatpak
          bash scripts/package-flatpak.sh 0.0.1 fixtures/snekkie fixtures/older

      - name: Launch the Flatpak and AppImage
        env:
          VERSION: ${{ needs.build-linux.outputs.version }}
        run: |
          bash scripts/test-linux-portable.sh flatpak "flatpak/Snekkie-$VERSION-x86_64.flatpak" target/portable-smoke/flatpak
          bash scripts/test-linux-portable.sh appimage "dist/Snekkie-$VERSION-x86_64.AppImage" target/portable-smoke/appimage

      - name: Online installer with the Flatpak
        run: |
          (cd flatpak && sha256sum -- *.flatpak > SHA256SUMS)
          (cd fixtures/older && sha256sum -- * > SHA256SUMS)
          bash scripts/test-install-script.sh flatpak fixtures/older flatpak

      - name: Keep launch screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-launch-screenshots
          path: target/portable-smoke/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: snekkie-flatpak
          path: flatpak/*.flatpak
          if-no-files-found: error

  build-macos:
    # One universal app for Apple silicon and Intel Macs, from macOS 11 on.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Read the version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [[ $GITHUB_REF == refs/tags/v* && ${GITHUB_REF_NAME#v} != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build for Apple silicon and Intel
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      # The older 0.0.1 image only exercises installer updates; it is not published.
      - name: Package the disk images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/package-macos.sh "$VERSION" dist
          bash scripts/package-macos.sh 0.0.1 fixtures/older

      - uses: actions/upload-artifact@v7
        with:
          name: snekkie-macos
          path: dist/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: macos-test-fixtures
          path: fixtures/older/*.dmg
          if-no-files-found: error

  test-macos:
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: snekkie-macos
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: macos-test-fixtures
          path: fixtures/older

      - name: Launch the app from the disk image
        env:
          VERSION: ${{ needs.build-macos.outputs.version }}
        run: bash scripts/test-macos-app.sh "dist/Snekkie-$VERSION-macos-universal.dmg" "$VERSION" target/macos-smoke

      - name: Online installer with the disk image
        run: |
          (cd dist && shasum -a 256 Snekkie-*.dmg > SHA256SUMS)
          (cd fixtures/older && shasum -a 256 Snekkie-*.dmg > SHA256SUMS)
          bash scripts/test-install-script.sh macos fixtures/older dist

      - name: Keep launch screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-launch-${{ matrix.os }}
          path: target/macos-smoke/
          if-no-files-found: ignore

  release:
    # Publishes the tag as a GitHub release with the builds attached. A tag
    # with a suffix (v2.1.0-beta.1) becomes a pre-release, so testers can
    # try it without it showing up as the latest version.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, sign-windows, build-linux, linux-packages, flatpak, build-macos, test-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the release

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: snekkie-windows

      - uses: actions/download-artifact@v8
        with:
          name: snekkie-linux

      - uses: actions/download-artifact@v8
        with:
          name: snekkie-flatpak

      - uses: actions/download-artifact@v8
        with:
          name: snekkie-macos

      # The online installers for Linux and macOS select assets from this
      # file, so every package must be listed exactly once.
      - name: Calculate checksums of the final release files
        run: |
          sha256sum Snekkie-Setup-*.exe snekkie-*-portable.exe snekkie-linux-x86_64.tar.gz \
            snekkie_*_amd64.deb snekkie-*.x86_64.rpm Snekkie-*-x86_64.AppImage Snekkie-*-x86_64.flatpak \
            Snekkie-*-macos-universal.dmg > SHA256SUMS
          cat SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 8 ]

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_ENABLED: ${{ needs.build-windows.outputs.signing }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_args=(--title "Snekkie $version")
          case "$GITHUB_REF_NAME" in *-*) release_args+=(--prerelease) ;; esac
          notes_file="docs/releases/$version.md"
          if [ -f "$notes_file" ]; then
            cp "$notes_file" "$RUNNER_TEMP/release-notes.md"
            notes_file="$RUNNER_TEMP/release-notes.md"
            release_args+=(--notes-file "$notes_file")
          else
            release_args+=(--generate-notes)
            notes_file="$RUNNER_TEMP/release-notes.md"
            : > "$notes_file"
            if [ "$SIGNING_ENABLED" = true ]; then
              release_args+=(--notes-file "$notes_file")
            fi
          fi
          if [ "$SIGNING_ENABLED" = true ]; then
            printf '\n\nFree code signing provided by SignPath.io, certificate by SignPath Foundation.\n\n[Code signing policy](https://github.com/%s/blob/%s/docs/code-signing.md)\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$notes_file"
          fi
          gh release create "$GITHUB_REF_NAME" \
            Snekkie-Setup-*.exe snekkie-*-portable.exe snekkie-linux-x86_64.tar.gz \
            snekkie_*_amd64.deb snekkie-*.x86_64.rpm Snekkie-*-x86_64.AppImage Snekkie-*-x86_64.flatpak \
            Snekkie-*-macos-universal.dmg SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            "${release_args[@]}"
