name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target. Linux also runs the pty-based
        # serial tests that Windows has to skip.
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  build-windows:
    # Builds for tagged releases, or on demand from the Actions tab so the
    # packaging can be checked without publishing anything.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          # A tag that doesn't match Cargo.toml would publish an installer
          # that reports the wrong version and breaks upgrade detection.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME.Substring(1)
            if ($tag -ne $version) {
              Write-Error "Tag v$tag does not match the version in Cargo.toml ($version). Bump Cargo.toml, commit, and tag again."
              exit 1
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: snekkie-windows-exe
          path: target/release/snekkie.exe

  installer:
    # Linux's NSIS package can build a 64-bit installer (the official Windows
    # one can't), and it's the build the installer was tested with.
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: snekkie-windows-exe
          path: exe

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build the installer
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          mkdir -p dist
          makensis -V2 -DVERSION="$VERSION" -DEXE=../exe/snekkie.exe installer/snekkie.nsi
          # The bare exe too, for anyone who'd rather not install.
          cp exe/snekkie.exe "dist/snekkie-$VERSION-portable.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: snekkie-windows
          path: dist/*.exe

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    # The binary only runs on systems whose glibc is at least as new as the
    # one it was built against, so build on the oldest supported runner.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      # A tarball, because release downloads drop the executable bit.
      - name: Package
        run: tar -czf snekkie-linux-x86_64.tar.gz -C target/release snekkie

      - uses: actions/upload-artifact@v4
        with:
          name: snekkie-linux
          path: snekkie-linux-x86_64.tar.gz

  release:
    # Publishes the tag as a GitHub release with the builds attached. A tag
    # with a suffix (v2.1.0-beta.1) becomes a pre-release, so testers can
    # try it without it showing up as the latest version.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installer, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the release

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            Snekkie-Setup-*.exe snekkie-*-portable.exe snekkie-linux-x86_64.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Snekkie ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
