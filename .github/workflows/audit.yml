name: Dependency audit

# Checks Cargo.lock against the RustSec advisory database. Runs weekly too,
# because new advisories appear without any change to this repository.
# Reviewed exceptions, each with its reason, are in .cargo/audit.toml.

on:
  push:
    branches: [main]
    paths: ["Cargo.lock", "Cargo.toml", ".cargo/audit.toml", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["Cargo.lock", "Cargo.toml", ".cargo/audit.toml", ".github/workflows/audit.yml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit
