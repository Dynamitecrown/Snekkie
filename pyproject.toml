[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snekkie"
version = "1.0.0"
description = "A tabbed SSH and serial terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lucas" }]
keywords = ["ssh", "serial", "terminal", "console", "cisco", "putty"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals :: Serial",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]

dependencies = [
    "PySide6>=6.6",
    # paramiko 5.0 removed SHA-1 key exchange and ssh-rsa signatures. That is
    # the right call security-wise, but it locks out older Cisco IOS images.
    # If you need to reach legacy gear on an isolated lab network, pin this to
    # "paramiko>=3.4,<5" and understand what you are re-enabling.
    "paramiko>=3.4",
    "pyserial>=3.5",
    "pyte>=0.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "ruff>=0.5",
]
build = ["pyinstaller>=6.0"]

[project.gui-scripts]
# Installs a snekkie launcher that opens with no console window behind it.
snekkie = "snekkie.__main__:main"

[tool.setuptools.packages.find]
include = ["snekkie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
